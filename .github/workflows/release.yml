name: Build, Package & Publish Extension

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'images/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Compile Bundles
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Extract Extension Version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Release v${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          files: '*.vsix'
          body: |
            ### Antigravity Accept & Reject Floating Buttons v${{ steps.pkg_version.outputs.version }}
            
            - Built with pure DOM zero-innerHTML renderer (Trusted Types safe)
            - Includes Send to Agent (@current_problems) bridge
            - Multi-file navigation and native Antigravity command hooks
            
            **Installation:**
            Download the attached `.vsix` file and install via Antigravity IDE or VS Code:
            Extensions -> ... (Views and More Actions) -> Install from VSIX...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --allow-missing-repository
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
